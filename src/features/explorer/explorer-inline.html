<!--
  Building Explorer (Three.js) embedded in a project page. It starts as a preview: the model
  turns slowly behind a "See in 3D" box and a big heading. The button opens the full explorer
  (levels panel, orbit, explode); "Close 3D" goes back to the preview.
-->
<div class="explorer explorer--inline is-preview" data-explorer aria-label="3D model of {{ project.name }}">
  <!-- @include features/explorer/explorer-body.html -->

  <div class="explorer__cta" data-ex-cta>
    <!-- a real 3D cube (CSS), six glass faces turning slowly -->
    <div class="explorer__cube" aria-hidden="true">
      <div class="cube">
        <i class="cube__face cube__face--front"></i>
        <i class="cube__face cube__face--back"></i>
        <i class="cube__face cube__face--right"></i>
        <i class="cube__face cube__face--left"></i>
        <i class="cube__face cube__face--top"></i>
        <i class="cube__face cube__face--bottom"></i>
      </div>
    </div>
    <button class="btn btn--light explorer__open" type="button" data-ex-open>See in 3D</button>
  </div>

  <div class="explorer__caption">
    <p class="explorer__kicker">Explore the building<br />level by level</p>
    <h2 class="explorer__big" id="model-heading">Explore in 3D</h2>
  </div>
</div>
