<!doctype html>
<!--
  Project page template: rendered once per file in src/data/projects/ as
  /projects/<slug>.html (see vite-plugins/html-pages.js). `project` is that project.
-->
<html lang="en-AU">
  <head>
    <!-- @include layouts/head.html -->
  </head>
  <body class="page page--project" data-project="{{ project.slug }}">
    <!-- @include sections/header/header.html -->

    <!-- @if project.hero -->
    <!-- @include pages/project/hero.html -->
    <!-- @end -->

    <main class="page__main" id="main" tabindex="-1">
      <!-- @if project.about -->
      <!-- @include pages/project/about.html -->
      <!-- @end -->
      <article class="project-page">
        <!-- @if project.about -->
        <h2 class="visually-hidden">Project details</h2>
        <!-- @else -->
        <header class="project-page__hero">
          <!-- @if project.hero -->
          <p class="eyebrow">About the project</p>
          <p class="project-page__intro">{{ project.summary }}</p>
          <!-- @include components/tag/tags.html -->
          <!-- @else -->
          <a class="link-back" href="/#project-{{ project.slug }}">← All projects</a>
          <p class="eyebrow">{{ project.eyebrow }} · {{ project.number }} / {{ project.total }}</p>
          <h1 class="project-page__title">{{ project.name }}</h1>
          <!-- @include components/tag/tags.html -->
          <p class="page__lede">{{ project.summary }}</p>
          <!-- @end -->
        </header>
        <!-- @end -->

        <dl class="facts project-page__facts">
          <!-- @each project.factList as fact -->
          <div>
            <dt>{{ fact.label }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
          <!-- @end -->
          <div>
            <dt>Materials</dt>
            <dd>{{ project.materials }}</dd>
          </div>
        </dl>
      </article>

      <!-- the 3D model: a turning preview with "See in 3D", which opens the full explorer -->
      <section class="pmodel" aria-labelledby="model-heading">
        <!-- @include features/explorer/explorer-inline.html -->
        <noscript><p class="project-page__hint">The 3D model needs JavaScript.</p></noscript>
      </section>
    </main>

    <!-- @include sections/footer/footer.html -->
    <script type="module" src="/src/pages/project/project.js"></script>
  </body>
</html>
