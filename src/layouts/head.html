<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}" />
<!-- @if page.noindex -->
<meta name="robots" content="noindex" />
<!-- @else -->
<link rel="canonical" href="{{ page.url }}" />
<!-- @end -->
<meta name="theme-color" content="#0d0e10" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- @if site.multiPage -->
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<!-- @end -->

<!-- Sharing (Open Graph / Twitter) -->
<meta property="og:type" content="{{ page.type }}" />
<meta property="og:site_name" content="Camillo Builders" />
<meta property="og:locale" content="en_AU" />
<meta property="og:title" content="{{ page.title }}" />
<meta property="og:description" content="{{ page.description }}" />
<meta property="og:url" content="{{ page.url }}" />
<meta property="og:image" content="{{ page.image }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{ page.imageAlt }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title }}" />
<meta name="twitter:description" content="{{ page.description }}" />
<meta name="twitter:image" content="{{ page.image }}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
