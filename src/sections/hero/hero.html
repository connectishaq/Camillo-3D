<!--
  01 Hero, after camillo.com.au's split hero: heading and buttons on the left, a big panel
  with one rounded corner on the right. The panel is the live map: `data-hero-panel` is an
  empty placeholder that hero.js measures to clip the fixed map stage to its shape, then
  scrolling expands the map to full screen.
-->
<section class="chapter chapter--hero" id="top" data-chapter="hero" data-label="Melbourne">
  <div class="hero__content">
    <h1 class="hero__title"><span>Residential &amp; </span><span>Commercial </span><span>Builders</span></h1>
    <p class="hero__lede">{{ company.heritage }}.</p>
    <div class="hero__actions">
      <a class="btn btn--solid" href="#contact">Get in Touch</a>
      <a class="btn btn--ghost" href="#projects">Explore projects</a>
    </div>
    <p class="hero__cue" aria-hidden="true"><span></span>Scroll to explore Melbourne</p>
  </div>
  <div class="hero__panel" data-hero-panel aria-hidden="true"></div>
</section>
