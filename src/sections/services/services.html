<!--
  05 What we build: the three disciplines as tall cards on Camillo maroon, with a big title and a
  small project photo in the corner. The figures live in About, so they aren't repeated here.
-->
<section class="chapter chapter--wide chapter--overview" id="services" data-chapter="overview" data-nav="services" data-label="What we build">
  <!-- the panel's maroon, grown from the panel to the whole screen as it arrives (services.js) -->
  <div class="overview-bg" data-overview-bg aria-hidden="true"></div>
  <div class="overview" data-reveal>
    <div class="overview__head">
      <div>
        <p class="overview__eyebrow">What we build</p>
        <h2 class="overview__title">Three ways<br />we build Melbourne</h2>
      </div>
      <figure class="overview__photo">
        <img
          src="{{ servicesPhoto.thumb }}"
          srcset="{{ servicesPhoto.srcset }}"
          sizes="(max-width: 860px) 40vw, 18vw"
          width="{{ servicesPhoto.width }}"
          height="{{ servicesPhoto.height }}"
          alt="{{ servicesPhoto.alt }}"
          loading="lazy"
          decoding="async"
        />
      </figure>
    </div>

    <div class="services">
      <!-- @each services as service -->
      <article class="service">
        <span class="service__num" aria-hidden="true">{{ service.number }}</span>
        <h3 class="service__title">{{ service.title }}</h3>
        <p class="service__text">{{ service.text }}</p>
      </article>
      <!-- @end -->
    </div>

    <div class="more">
      <p class="more__label">Also in the portfolio</p>
      <ul class="more__list">
        <!-- @each moreProjects as name -->
        <li>{{ name }}</li>
        <!-- @end -->
      </ul>
    </div>
  </div>
</section>
