<!-- 06 Contact (the footer sits inside this last chapter, over the map) -->
<section class="chapter chapter--contact" id="contact" data-chapter="contact" data-nav="contact" data-label="Contact">
  <div class="contact" data-reveal>
    <p class="eyebrow">Start a conversation</p>
    <h2 class="contact__title">Let’s build<br /><em>something lasting.</em></h2>
    <div class="contact__grid">
      <a class="contact__item" href="mailto:{{ company.contact.email }}"><span>Email</span><strong>{{ company.contact.email }}</strong></a>
      <a class="contact__item" href="{{ company.contact.phoneHref }}"><span>Phone</span><strong>{{ company.contact.phone }}</strong></a>
      <div class="contact__item"><span>Visit</span><strong>{{ company.contact.address }}</strong></div>
    </div>
  </div>
  <!-- @include sections/footer/footer.html -->
</section>
